name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: competence_assessment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore --configuration Release
      

      - name: Run Unit Tests
        run: dotnet test CompetenceAssessment.Unit.Tests/CompetenceAssessment.Unit.Tests.csproj --configuration Release --no-build
      

      - name: Run Integration Tests
        run: dotnet test CompetenceAssessment.Integration.Tests/CompetenceAssessment.Integration.Tests.csproj --configuration Release --no-build
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=competence_assessment_test;Username=postgres;Password=postgres"
      

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Install Newman
        run: npm install -g newman
      
      - name: Start Application
        run: |
          dotnet run --project CompetenceAssessment.Web/CompetenceAssessment.Web.csproj \
            --configuration Release \
            --urls "http://localhost:5173" &
          sleep 15
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=competence_assessment_test;Username=postgres;Password=postgres"
      
      - name: Run Functional Tests
        run: |
          newman run functional-tests.json \
            --env-var "baseUrl=${{ secrets.FUNCTIONAL_TESTS_BASE_URL }}"
