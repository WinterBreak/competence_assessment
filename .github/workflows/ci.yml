name: PR Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - run: dotnet restore
      
      - run: dotnet build --configuration Release --no-restore
      
      - run: dotnet test CompetenceAssessment.Unit.Tests/CompetenceAssessment.Unit.Tests.csproj --configuration Release --no-build
